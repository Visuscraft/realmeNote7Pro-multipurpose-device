<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>realme Note 7 Pro — device dashboard</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, sans-serif;
        background: #101317;
        color: #e8eaed;
      }
      h1 { font-size: 1.25rem; margin: 0 0 1rem; }
      .grid {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }
      .card {
        background: #1b2027;
        border: 1px solid #2b3138;
        border-radius: 10px;
        padding: 0.9rem 1rem;
      }
      .label { font-size: 0.75rem; text-transform: uppercase; color: #9aa4af; }
      .value { font-size: 1.4rem; margin-top: 0.25rem; word-break: break-word; }
      footer { margin-top: 1.25rem; font-size: 0.75rem; color: #9aa4af; }
      .error { color: #ff8a80; }
    </style>
  </head>
  <body>
    <h1>realme Note 7 Pro — multipurpose device</h1>
    <div class="grid" id="cards"></div>
    <footer id="footer">loading…</footer>
    <script src="app.js"></script>
  </body>
</html>
